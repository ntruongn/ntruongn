<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>
    {% if page.title and page.title != "home" and page.title != "Home" %}
        {{ page.title }} | {{ site.author.name }}
    {% else %}
        {{ site.title }}
    {% endif %}
</title>

<!-- Meta SEO & Academic Tags -->
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="author" content="{{ site.author.name }}">
<meta name="keywords" content="Cybersecurity, AI Researcher, Deep Learning Security, Adversarial ML, Membership Inference Attacks, Network Security, Malware Analysis, {{ site.author.name }}, {{ site.author.native_name }}">

<!-- Google Scholar Citation Meta Tags -->
<meta name="citation_author" content="{{ site.author.name }}">
<meta name="citation_keywords" content="AI Security; Adversarial Machine Learning; Privacy-Preserving AI; Network Intrusion Detection; Malware Analysis">
{% if page.citation_title %}
<meta name="citation_title" content="{{ page.citation_title }}">
<meta name="citation_publication_date" content="{{ page.date | date: '%Y/%m/%d' }}">
{% endif %}

<!-- Open Graph & Twitter Cards -->
<meta property="og:title" content="{% if page.title and page.title != 'home' and page.title != 'Home' %}{{ page.title }} | {{ site.author.name }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:type" content="website">
<meta property="og:image" content="https://github.com/ntruongn.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{% if page.title and page.title != 'home' and page.title != 'Home' %}{{ page.title }} | {{ site.author.name }}{% else %}{{ site.title }}{% endif %}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">

<!-- Structured Data (JSON-LD) for Academic Profile -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author.name }}",
  "alternateName": "{{ site.author.native_name }}",
  "url": "{{ site.url }}",
  "image": "https://github.com/{{ site.author.github }}.png",
  "jobTitle": "Cybersecurity Engineer & AI Researcher",
  "worksFor": {
    "@type": "Organization",
    "name": "{{ site.author.affiliation }}"
  },
  "sameAs": [
    "https://github.com/{{ site.author.github }}",
    "https://linkedin.com/in/{{ site.author.linkedin }}",
    "{{ site.author.scholar }}",
    "{{ site.author.orcid }}"
  ],
  "knowsAbout": [
    "Adversarial Machine Learning",
    "Membership Inference Attacks",
    "AI Privacy & Security",
    "Android Malware Analysis",
    "Network Intrusion Detection Systems"
  ]
}
</script>

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<!-- Theme & Language Initialization (No Flash) -->
<script>
    (function() {
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', savedTheme);

        const savedLang = localStorage.getItem('site_lang') || 'vi';
        document.documentElement.setAttribute('data-lang', savedLang);
        document.documentElement.setAttribute('lang', savedLang);
    })();
</script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Bootstrap 5, Bootstrap Icons, FontAwesome & Academicons -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
