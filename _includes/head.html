<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>
    {% if page.title and page.title != "home" %}
        {{ page.title }} | {{ site.author.name }}
    {% else %}
        {{ site.title }}
    {% endif %}
</title>

<!-- Meta SEO -->
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="author" content="{{ site.author.name }}">
<meta name="keywords" content="Cybersecurity, AI Researcher, Deep Learning Security, Adversarial ML, Network Security, Malware Analysis, {{ site.author.name }}">

<!-- Open Graph -->
<meta property="og:title" content="{% if page.title and page.title != 'home' %}{{ page.title }} | {{ site.author.name }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:type" content="website">

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<!-- Theme & Language Initialization (No Flash) -->
<script>
    (function() {
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', savedTheme);

        const savedLang = localStorage.getItem('site_lang') || 'vi';
        document.documentElement.setAttribute('data-lang', savedLang);
        document.documentElement.setAttribute('lang', savedLang);
    })();
</script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Bootstrap 5 & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Custom Stylesheet -->
<link rel="stylesheet" href="/assets/css/styles.css">
