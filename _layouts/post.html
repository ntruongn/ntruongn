---
layout: page
---
<div class="mb-4 pb-3 border-bottom border-secondary border-opacity-25">
    <div class="d-flex align-items-center gap-2 mb-2">
        <span class="cyber-badge badge-cyan">
            <i class="bi bi-file-earmark-text"></i> Post
        </span>
        <span class="text-secondary small font-monospace">
            <i class="bi bi-clock"></i> {{ page.date | date: site.ntruongn.date_format | default: "%b %d, %Y" }}
        </span>
    </div>
    <h1 class="text-light fw-bold mb-2">{{ page.title }}</h1>
    {% if page.description %}
    <p class="lead text-secondary mb-0">{{ page.description }}</p>
    {% endif %}
</div>

<div class="post-article-content">
    {{ content }}
</div>
